# Enables detailed information display in the console.
# If you encounter an issue, enable this option and send the errors to support.
enable-debug: true

# Enables execution time debugging to measure plugin performance.
# Useful for identifying bottlenecks and optimizing performance.
enable-debug-time: true

# Storage:
# SQLITE - For the launch of the plugin only.
# MYSQL
# MARIADB
#
# We advise you to use MYSQL or MARIADB, the SQLITE storage is only there to install the plugin and do some tests, not all features are available with SQLITE yet.
# The plugin will work, but some features like sanctions update when launching the plugin will not work.
# This will be fixed in future plugin updates
storage-type: SQLITE

# Configuration of your database, it is recommended to use the database to store your data.
# JSON does not support everything
database-configuration:
  # The prefix that will be applied to all tables, if you have several plugins with the same database you must have one.
  # It is advisable not to change this value
  table-prefix: "zjobs_"
  # IP Address of the machine the database is hosted on
  host: 192.168.10.10
  # Port of the database, by default, MYSQL's port is 3306
  port: 3306
  # Database username
  user: homestead
  # Database password
  password: 'secret'
  # Database
  database: zjobs
  # Enable of not the sql debug mode
  debug: true

default-jobs:
  - "miner"
  - "farmer"
  - "lumberjack"
  - "enchanter"
  - "brewer"
  - "hunter"

decimal-format: "#.##"

progression-bar:
  color: WHITE
  overlay: PROGRESS

jobs-limit-permissions:
  - permission: "zjobs.limit.player"
    limit: 1
  - permission: "zjobs.limit.vip"
    limit: 2
  - permission: "zjobs.limit.admin"
    limit: 3

default-economy: "VAULT"
currency-name: "money"
money-reason: "Job money"

events:
  JobsExpGainEvent: true
  JobLevelEvent: true
  JobPrestigeEvent: true
  JobRewardEvent: true
  JobMoneyGainEvent: true

# Allows setting a world list where jobs are disabled
disabled-worlds:
  - "world_the_end"

# Progress bar used by the %experience-progressbar%, %level-progressbar% and %prestige-progressbar% placeholders
progress-bar:
  filled: <glyph:iconic_utils_check>
  empty: <glyph:iconic_utils_cross>
  filled-color: <white>
  empty-color: <white>
  width: 10

placeholder-boosts:
  empty: "&cAucun boosts actifs"
  result: "%boost-jobs% - %boost-remaining%/%boost-amount%\nExperience: %boost-experience%\nArgent: %boost-money%"
  every-jobs: "Tous les métiers"
  every-actions: "Toutes les actions"
  every-targets: "Toutes les cibles"
  between: "\n"

enable-boost-finish-message: true

force-block-check:
  - SUGAR_CANE
  - KELP
  - BAMBOO

# 30 secondes
update-jobs-ticks: 600

# Anti-farming: prevents the "place / break / place / break" exploit where a
# player places a block then immediately breaks it to farm points and money.
# A block placed by a player is remembered for a short time; breaking it while
# it is still in this temporary history gives no reward.
place-break-protection:
  # Enable or disable the protection.
  enable: true
  # How long (in seconds) a placed block stays protected. After this delay the
  # block is considered legitimate again and breaking it rewards normally.
  # Column plants (sugar cane, bamboo, kelp) grow over time, so their upper
  # blocks are never affected once the delay has passed.
  duration-seconds: 300