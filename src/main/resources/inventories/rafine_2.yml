name: "&8ʀᴀғғɪɴᴇʀɪᴇ &7- &fɪɪɪ"
size: 27
# Refresh every second so the remaining-time lore stays up-to-date.
updateInterval: 20
items:

  # ───────────────────────────────────────────
  #  Décoration : bordure noire
  # ───────────────────────────────────────────
  border:
    isPermanent: true
    item:
      material: BLACK_STAINED_GLASS_PANE
      name: ""
    slots:
      - 0-9
      - 13
      - 17
      - 18-26

  # ───────────────────────────────────────────
  #  Slot de dépôt (ZJOBS_ITEM_RAFINE)
  #  Le joueur clique sur un item dans son
  #  inventaire pour le placer ici. Un autre
  #  clic sur l'item déposé démarre le timer.
  # ───────────────────────────────────────────
  input_1:
    type: ZJOBS_ITEM_RAFINE_2
    isPermanent: true
    slot: 11
    item:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: "#3f3f3fSlot de dépôt &7(ɪɪɪ)"
      lore:
        - ""
        - "#3f3f3fCliquez sur un minerai dans votre"
        - "#3f3f3finventaire pour le placer ici."
        - ""
        - "#34ebb7+2% #3f3f3fde chance de réussite"
        - "#3f3f3fdurée max#3f3f3f: &f300#3f3f3fs"

  # ───────────────────────────────────────────
  #  Slot timer (ZJOBS_ITEM_RAFINE_TIMER)
  #  Affiche le temps restant en temps réel
  # ───────────────────────────────────────────
  timer:
    type: ZJOBS_ITEM_RAFINE_TIMER
    isPermanent: true
    slot: 13
    item:
      material: GOLD_NUGGET
      name: "#ffd353⏳ En attente..."
      lore:
        - ""
        - "#3f3f3fAucun raffinage en cours."

  # ───────────────────────────────────────────
  #  Slot résultat (ZJOBS_ITEM_RAFINE_RESULT)
  #  Barrière par défaut, item raffiné quand
  #  le timer arrive à zéro. Clic = récupérer.
  # ───────────────────────────────────────────
  result:
    type: ZJOBS_ITEM_RAFINE_RESULT
    isPermanent: true
    slot: 15
    item:
      material: BARRIER
      name: "#ff6b6bAucun résultat"
      lore:
        - ""
        - "#3f3f3fL'item raffiné apparaîtra ici"
        - "#3f3f3fune fois le timer terminé."

  # ───────────────────────────────────────────
  #  Info centrale (décoratif)
  # ───────────────────────────────────────────
  indicator:
    isPermanent: true
    slot: 10
    item:
      material: BLAST_FURNACE
      name: "#34ebb7ʀᴀғғɪɴᴇʀɪᴇ"
      lore:
        - ""
        - "#ffd353ℹ Comment ça marche#3f3f3f:"
        - "#3f3f3f• Cliquez sur un minerai de votre"
        - "#3f3f3f  inventaire pour le placer."
        - "#3f3f3f• Cliquez sur le minerai déposé"
        - "#3f3f3f  pour démarrer le raffinage."
        - "#3f3f3f• Attendez puis cliquez sur le"
        - "#3f3f3f  résultat pour le récupérer."
        - ""

  arrow_1:
    isPermanent: true
    slot: 12
    item:
      material: ORANGE_STAINED_GLASS_PANE
      name: "#ffd353→"

  arrow_2:
    isPermanent: true
    slot: 14
    item:
      material: ORANGE_STAINED_GLASS_PANE
      name: "#ffd353→"

  close:
    isPermanent: true
    slot: 16
    item:
      material: BARRIER
      name: "#ff6b6bFermer"
      lore:
        - ""
        - "#3f3f3fFerme ce menu."
    close-inventory: true
