# Example job configuration showing MythicMobs integration
name: "ᴍʏᴛʜɪᴄ ʜᴜɴᴛᴇʀ"

# Base value used to calculate the experience required for each level.
base-experience: 150

# The Maximum number of levels the player can reach in this job.
max-levels: 100

# Maximum number of prestiges available.
max-prestiges: 10

# Formula used to calculate the amount of experience required for each level.
formula: "baseExperience * (1 + 0.05 * level + 0.005 * level^2) * (1 + 0.3 * (prestige / maxPrestiges))"

# Determines if the player can leave this job.
can-leave: true

# Determines if a player can join this job.
can-join: true

# List of actions the player must perform to earn experience in this job.
# You can now use MythicMobs entities with the mm: prefix!
actions:

  # MythicMobs entities (using mm: prefix)
  - type: KILL_ENTITY
    entity: "mm:SkeletonKing"
    experience: 50
    money: 10

  - type: KILL_ENTITY
    entity: "mm:AncientDragon"
    experience: 100
    money: 25

  - type: KILL_ENTITY
    entity: "mm:ZombieChampion"
    experience: 30
    money: 5

  # Vanilla entities still work as before
  - type: KILL_ENTITY
    entity: ZOMBIE
    experience: 1
    money: 0.2

  - type: KILL_ENTITY
    entity: SKELETON
    experience: 1
    money: 0.2

  - type: KILL_ENTITY
    entity: WITHER
    experience: 10
    money: 2.0

  - type: KILL_ENTITY
    entity: ENDER_DRAGON
    experience: 15
    money: 3.0

# Rewards for leveling up
rewards:

  - level: -1
    prestige: -1
    actions:
      - type: sound
        sound: ENTITY_PLAYER_LEVELUP
      - type: message
        messages:
          - "&8(#42f59bJobs&8) &fYou are now #34ebb7ᴍʏᴛʜɪᴄ ʜᴜɴᴛᴇʀ &fP%prestige% &flvl #f7f725%level%"
      - type: zjobs_add_points
        points: 1

  - level: 10
    prestige: 1
    actions:
      - type: console_commands
        commands:
          - "eco give %player% 1000"
          - "bc %player% reached level 10 of Mythic Hunter!"
